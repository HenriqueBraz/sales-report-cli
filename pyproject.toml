[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-report-cli"
version = "0.1.0"
description = "Advanced sales report generator"
requires-python = ">=3.10"

[project.scripts]
vendas-cli = "sales_report.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/sales_report"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

